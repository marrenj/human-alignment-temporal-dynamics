## ---PATHS--- ##
# Concept-organized THINGS image dir (img_dir/<concept>/<stimulus>).
img_dir: "paths:things_fmri_images"
annotations_file: "./pipeline/data/things_fmri/things_fmri_annotations.csv"
inference_save_dir: "./pipeline/results"
model_weights_path: "./pipeline/results"

## ---MODEL PARAMETERS--- ##
backbone: ViT-L/14
vision_layers: 2
transformer_layers: 1
rank: 32
load_hba: true

## ---INFERENCE PARAMETERS--- ##
dataset: things
# ThingsFMRIDataset runs every stimulus in annotations_file (12 per concept);
# max_images_per_category is unused for this dataset.
max_images_per_category: null
evaluation_type: neural
cuda: 0
batch_size: 128
num_workers: 4

## ---RSA OPTIONS--- ##
model_rdm_distance_metric: cosine
rsa_similarity_metric: spearman
reference_rdm_distance_metric: pearson

# 27 THINGS-fMRI ROIs (Hebart et al. 2023), subject-averaged 720-concept RDMs
# built by pipeline/scripts/preprocessing/prepare_things_fmri_rdms.py.
reference_rdm_paths:
  lEBA: "./pipeline/data/things_fmri/reference_rdms/lEBA_avg_rdm_vector.npy"
  rEBA: "./pipeline/data/things_fmri/reference_rdms/rEBA_avg_rdm_vector.npy"
  lFFA: "./pipeline/data/things_fmri/reference_rdms/lFFA_avg_rdm_vector.npy"
  rFFA: "./pipeline/data/things_fmri/reference_rdms/rFFA_avg_rdm_vector.npy"
  lOFA: "./pipeline/data/things_fmri/reference_rdms/lOFA_avg_rdm_vector.npy"
  rOFA: "./pipeline/data/things_fmri/reference_rdms/rOFA_avg_rdm_vector.npy"
  lLOC: "./pipeline/data/things_fmri/reference_rdms/lLOC_avg_rdm_vector.npy"
  rLOC: "./pipeline/data/things_fmri/reference_rdms/rLOC_avg_rdm_vector.npy"
  LOC: "./pipeline/data/things_fmri/reference_rdms/LOC_avg_rdm_vector.npy"
  lPPA: "./pipeline/data/things_fmri/reference_rdms/lPPA_avg_rdm_vector.npy"
  rPPA: "./pipeline/data/things_fmri/reference_rdms/rPPA_avg_rdm_vector.npy"
  lRSC: "./pipeline/data/things_fmri/reference_rdms/lRSC_avg_rdm_vector.npy"
  rRSC: "./pipeline/data/things_fmri/reference_rdms/rRSC_avg_rdm_vector.npy"
